# Target B: a VM with Docker and nginx (kept for future hosting, D-027). nginx sits in front of two containers:
# `web` (this repo's image, the Node SSR server on :4000) and `api` (fitmanager-api on :3000). The compose file
# that wires them lives in ../fitmanager-infra/vm/. Headers match the Cloudflare target (public/_headers).
upstream web_ssr { server web:4000; }
upstream api { server api:3000; }

server {
    listen 80;
    server_name _;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The API, same origin: the browser calls /api.
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles (main-3MJVW4VT.js) never change: served from the shared volume, cached for a year.
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css|mjs)$" {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @ssr;
    }

    # Images and fonts from public/assets keep their names: a short cache, so a new photo shows up.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1h;
        try_files $uri @ssr;
    }

    # Everything else is rendered by the SSR server, which sets Cache-Control and X-Robots-Tag per route.
    location / {
        try_files /dev/null @ssr;
    }

    location @ssr {
        proxy_pass http://web_ssr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
