<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>FitManager</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#d90a14" />
        <!-- Replaced at start-up by the brand's initials in the active theme colour (ThemeService). The .ico is for Safari. -->
        <link type="image/svg+xml" href="favicon.svg" rel="icon" />
        <link href="favicon.ico" rel="alternate icon" sizes="any" />
        <!-- Member portal install (PWA basics, phase 0.5 H6). Placeholder brand until Q-006. -->
        <link href="manifest.webmanifest" rel="manifest" />
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
        <!-- Design system fonts: Vazirmatn (UI text, only the weights in use) and Rubik Dirt (display headlines). -->
        <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
        <!--
            Runs before the first paint, so neither a prerendered page nor the app shell flashes the wrong look (ThemeService saves these):
            1. light or dark mode for the consoles and portal (`.dark`): the saved choice, else the system setting;
            2. the visitor's colour theme (a prerendered page carries the default theme's variables);
            3. the start-up loader's colours.
            Only hex colours are applied, so a tampered storage value cannot inject CSS.
        -->
        <script>
            try {
                var root = document.documentElement;
                var hex = /^#[0-9a-f]{3,8}$/i;
                var mode = JSON.parse(localStorage.getItem('app.theme') || 'null');
                if (mode === 'dark' || (mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
                    root.classList.add('dark');
                var palette = JSON.parse(localStorage.getItem('app.palette-vars') || 'null');
                if (palette && palette.vars && /^[a-z0-9-]+$/.test(palette.id)) {
                    // Drop the default theme's shades the prerendered HTML carries: a theme without exact shades mixes its own.
                    for (var i = root.style.length - 1; i >= 0; i--) {
                        if (/^--(brand|primary|secondary|surface)-/.test(root.style.item(i))) root.style.removeProperty(root.style.item(i));
                    }
                    for (var name in palette.vars) {
                        if (/^--(brand|primary|secondary|surface)-[a-z0-9-]+$/.test(name) && hex.test(palette.vars[name]))
                            root.style.setProperty(name, palette.vars[name]);
                    }
                    root.setAttribute('data-theme', palette.id);
                    root.toggleAttribute('data-tint', !!palette.tint);
                }
                var splash = JSON.parse(localStorage.getItem('app.splash') || 'null');
                if (splash && hex.test(splash.primary)) root.style.setProperty('--splash-primary', splash.primary);
                if (splash && hex.test(splash.bg)) root.style.setProperty('--splash-bg', splash.bg);
            } catch (e) {}
        </script>
        <style>
            .splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.75rem;
                background:
                    radial-gradient(40rem 30rem at 50% 45%, color-mix(in srgb, var(--splash-primary, #d90a14) 22%, transparent), transparent 70%),
                    var(--splash-bg, #1b1b1b);
            }
            .splash-mark {
                position: relative;
                display: grid;
                width: 5.5rem;
                height: 5.5rem;
                place-items: center;
                border-radius: 1.25rem;
                background: var(--splash-primary, #d90a14);
                box-shadow: 0 0.75rem 2.5rem color-mix(in srgb, var(--splash-primary, #d90a14) 45%, transparent);
                animation: splash-beat 1.2s ease-in-out infinite;
            }
            .splash-mark::after {
                content: '';
                position: absolute;
                inset: -0.6rem;
                border: 2px solid var(--splash-primary, #d90a14);
                border-radius: 1.6rem;
                opacity: 0;
                animation: splash-ring 1.2s ease-out infinite;
            }
            .splash-mark svg {
                width: 3.4rem;
                height: 3.4rem;
                animation: splash-lift 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
            }
            .splash-mark path {
                fill: none;
                stroke: #fff;
                stroke-width: 2.6;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .splash-bar {
                position: relative;
                width: 9rem;
                height: 3px;
                overflow: hidden;
                border-radius: 9999px;
                background: rgb(255 255 255 / 12%);
            }
            .splash-bar::before {
                content: '';
                position: absolute;
                inset: 0 auto 0 0;
                width: 40%;
                border-radius: inherit;
                background: var(--splash-primary, #d90a14);
                animation: splash-slide 1.1s ease-in-out infinite;
            }
            @keyframes splash-beat {
                0%,
                100% {
                    transform: scale(1);
                }
                15% {
                    transform: scale(1.08);
                }
                30% {
                    transform: scale(0.98);
                }
                45% {
                    transform: scale(1.04);
                }
            }
            @keyframes splash-ring {
                0% {
                    opacity: 0.6;
                    transform: scale(0.92);
                }
                100% {
                    opacity: 0;
                    transform: scale(1.25);
                }
            }
            @keyframes splash-lift {
                0%,
                100% {
                    transform: translateY(0.45rem) rotate(0deg);
                }
                45% {
                    transform: translateY(-0.45rem) rotate(-6deg);
                }
                60% {
                    transform: translateY(-0.45rem) rotate(4deg);
                }
            }
            @keyframes splash-slide {
                0% {
                    transform: translateX(-100%);
                }
                100% {
                    transform: translateX(250%);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .splash-mark,
                .splash-mark::after,
                .splash-bar::before {
                    animation-duration: 2.4s;
                }
                .splash-mark {
                    animation: none;
                }
                .splash-mark svg {
                    animation: none;
                }
            }
        </style>
    </head>
    <body class="font-sans antialiased">
        <app-root>
            <!-- Shown until Angular boots: no blank page on slow connections. A dumbbell being lifted, in the brand block. -->
            <div class="splash" aria-live="polite" role="status">
                <div class="splash-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11" /></svg>
                </div>
                <div class="splash-bar" aria-hidden="true"></div>
                <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Loading</span>
            </div>
        </app-root>
        <noscript>This application requires JavaScript.</noscript>
    </body>
</html>
